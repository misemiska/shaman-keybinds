<body data-nav="home">

<section class="hero">

  <div class="in herogrid">

        <input id="q" type="search" placeholder="Search guides" autocomplete="off">
      </label>
      <div class="chipbar" id="chipbar" role="group" aria-label="Filter by topic"></div>
    </div>
    <div class="cards" id="cards"></div>
    <p class="nomatch" id="nomatch" hidden>No guides match that search.</p>
  </div>
</main>

<div id="site-foot"></div>
<script src="site.js"></script>
